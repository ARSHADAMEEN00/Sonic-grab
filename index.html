<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>SONIC GRAB — Ad-Free Music Discovery &amp; Free Legal MP3 Downloads</title>
    <meta
      name="description"
      content="Discover ad-free music with zero audio ads, live global and Indian charts, and verified free Creative Commons &amp; Public Domain MP3 downloads directly in your browser."
    />
    <meta
      name="keywords"
      content="ad free music, free downloadable mp3, legal mp3 downloader, creative commons music, public domain mp3, jamendo free mp3, internet archive audio, ad free music player, pwa music app"
    />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="AFO (https://ameen.osperb.com)" />
    <meta name="theme-color" content="#00E5A3" />
    <meta name="application-name" content="SONIC GRAB" />

    <!-- Mobile PWA / iOS -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SONIC GRAB" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SONIC GRAB" />
    <meta
      property="og:title"
      content="SONIC GRAB — Ad-Free Music Discovery &amp; Free Legal MP3 Downloads"
    />
    <meta
      property="og:description"
      content="Listen to ad-free music previews, browse trending global &amp; Indian releases, and download verified free Creative Commons &amp; Public Domain MP3s."
    />
    <meta property="og:image" content="/icons/icon-512.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="SONIC GRAB — Ad-Free Music Discovery &amp; Free Legal MP3 Downloads"
    />
    <meta
      name="twitter:description"
      content="Ad-free music discovery and legal Creative Commons / Public Domain MP3 downloads in an installable PWA."
    />
    <meta name="twitter:image" content="/icons/icon-512.png" />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "SONIC GRAB",
        "applicationCategory": "MusicApplication",
        "operatingSystem": "Web, macOS, Windows, iOS, Android",
        "isAccessibleForFree": true,
        "author": {
          "@type": "Person",
          "name": "AFO",
          "url": "https://ameen.osperb.com"
        },
        "description": "Ad-free music discovery and verified Creative Commons & Public Domain MP3 download progressive web app.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "featureList": [
          "Ad-free music discovery and previews",
          "Verified free downloadable Creative Commons and Public Domain MP3s",
          "Artist, genre, and latest release batch filtering",
          "Duplicate download detection and local browser library"
        ]
      }

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap"

    />
  </head>
  <body style="margin: 0; background-color: #0b0e14; color: #f3f6fc;">
    <div id="root"></div>
